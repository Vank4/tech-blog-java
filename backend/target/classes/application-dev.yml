spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/tech_blog_java?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: false
    clean-disabled: false

server:
  port: 8081

app:
  jwt:
    secret: dev-secret-key-change-in-production-at-least-256-bits-long
    expiration: 86400000
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173,http://localhost:8080
  upload:
    path: uploads/
  email-verification:
    base-url: http://localhost:8081/api/v1/auth/verify-email
    expiration-minutes: 60
  password-reset:
    base-url: http://localhost:8081/reset-password
    expiration-minutes: 30
  mail:
    from: no-reply@techblog.local

logging:
  level:
    root: INFO
    com.techblog: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

