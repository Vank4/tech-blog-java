spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/tech_blog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  flyway:
    enabled: true
    baseline-on-migrate: false
    clean-disabled: false

server:
  port: 8081

app:
  jwt:
    secret: dev-secret-key-change-in-production-at-least-256-bits-long
    expiration: 86400000
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173,http://localhost:8080
  upload:
    path: uploads/

logging:
  level:
    root: INFO
    com.techblog: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

