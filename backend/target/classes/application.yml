spring:
  application:
    name: tech-blog-java
  profiles:
    default: dev

  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/tech_blog_java?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8081

app:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-here-change-in-production}
    expiration: ${JWT_EXPIRATION:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  upload:
    path: ${UPLOAD_PATH:uploads/}
  email-verification:
    base-url: ${EMAIL_VERIFICATION_BASE_URL:http://localhost:8081/api/v1/auth/verify-email}
    expiration-minutes: ${EMAIL_VERIFICATION_EXPIRATION_MINUTES:60}
  password-reset:
    base-url: ${PASSWORD_RESET_BASE_URL:http://localhost:8081/reset-password}
    expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:30}
  mail:
    from: ${MAIL_FROM:no-reply@techblog.local}

logging:
  level:
    root: INFO
    com.techblog: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

