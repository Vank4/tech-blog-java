<!DOCTYPE html>
<html class="dark" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Tác giả | Bài viết của tôi - TechNexus</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#06e8f9",
                        "background-dark": "#0f2123",
                        "surface-dark": "#162a2d",
                        "accent-purple": "#a855f7"
                    },
                    fontFamily: { "display": ["Inter", "sans-serif"] }
                }
            }
        }
    </script>
    <style>
        .rejection-shake:hover { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
</head>
<body class="bg-background-dark text-slate-200 font-display flex h-screen overflow-hidden">

<aside class="w-64 bg-surface-dark border-r border-slate-800 flex flex-col z-20 shrink-0">
    <div class="h-20 flex items-center px-6 border-b border-slate-800">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-primary to-accent-purple flex items-center justify-center text-background-dark font-bold text-lg mr-2">A</div>
        <span class="text-xl font-bold text-white tracking-tight">Author<span class="text-primary">Hub</span></span>
    </div>
    <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
        <a href="/author/posts" class="flex items-center gap-3 px-4 py-3 bg-primary text-background-dark font-bold rounded-xl shadow-[0_0_15px_rgba(6,232,249,0.3)]">
            <span class="material-icons">description</span> Bài viết của tôi
        </a>
        <a href="/author/posts/editor" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800/50 rounded-xl transition-colors">
            <span class="material-icons">add_box</span> Viết bài mới
        </a>
        <hr class="border-slate-800 my-4"/>
        <a href="/" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white transition-colors">
            <span class="material-icons">arrow_back</span> Quay lại trang chủ
        </a>
    </nav>
</aside>

<main class="flex-1 flex flex-col h-screen overflow-hidden">
    <header class="h-20 bg-surface-dark border-b border-slate-800 flex items-center justify-between px-8 shrink-0">
        <div>
            <h1 class="text-2xl font-bold text-white">Bài viết của tôi</h1>
            <p class="text-[10px] text-slate-500 uppercase tracking-widest mt-1">DASHBOARD & CONTENT WORKFLOW</p>
        </div>
        <button onclick="location.href='/author/posts/editor'" class="bg-primary hover:bg-cyan-400 text-background-dark font-black py-2.5 px-6 rounded-xl transition-all shadow-[0_0_20px_rgba(6,232,249,0.2)] flex items-center gap-2">
            <span class="material-icons">add</span> VIẾT BÀI MỚI
        </button>
    </header>

    <div class="flex-1 overflow-auto p-8 bg-[#0a1618]">
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8" id="post-grid">
            <div class="col-span-full flex flex-col items-center justify-center py-40">
                <div class="w-16 h-16 border-4 border-primary border-t-transparent rounded-full animate-spin"></div>
                <p class="text-slate-500 mt-4 font-medium">Đang tải dữ liệu bài viết...</p>
            </div>
        </div>
    </div>
</main>

<script>
    const API_BASE = "http://localhost:8081/api/v1";

    async function fetchMyPosts() {
        const grid = document.getElementById('post-grid');
        try {
            const res = await fetch(`${API_BASE}/posts?size=100`);
            const json = await res.json();
            const posts = json.data?.content || [];

            if (posts.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-20 bg-surface-dark/30 rounded-3xl border border-dashed border-slate-800">
                        <span class="material-icons text-6xl text-slate-700 mb-4">article</span>
                        <p class="text-slate-500 font-medium">Bạn chưa có bài viết nào. Hãy tỏa sáng ngay hôm nay!</p>
                        <button onclick="location.href='/author/posts/editor'" class="mt-4 text-primary hover:underline">Bắt đầu viết bài đầu tiên</button>
                    </div>`;
                return;
            }

            grid.innerHTML = posts.map(post => `
                <div class="bg-surface-dark rounded-3xl border border-slate-800 overflow-hidden group hover:border-primary/50 transition-all duration-500 shadow-2xl flex flex-col h-full relative">
                    <div class="relative h-44 overflow-hidden shrink-0">
                        <img src="${post.thumbnailUrl || 'https://images.unsplash.com/photo-1498050108023-c5249f4df085'}"
                             class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-1000" alt="thumb"/>
                        <div class="absolute inset-0 bg-gradient-to-t from-background-dark/80 to-transparent"></div>
                        <div class="absolute top-4 right-4">
                            ${getStatusBadge(post.status)}
                        </div>
                    </div>

                    <div class="p-6 flex flex-col flex-1">
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-[10px] font-black text-primary uppercase tracking-[0.2em]">${post.categoryName || 'General'}</span>
                            <span class="flex items-center gap-1 text-[10px] text-slate-500 font-bold">
                                <span class="material-icons text-[14px]">visibility</span> ${post.viewCount || 0}
                            </span>
                        </div>

                        <h3 class="text-lg font-bold text-white mb-2 line-clamp-2 group-hover:text-primary transition-colors duration-300 cursor-pointer"
                            onclick="location.href='/author/posts/editor?id=${post.id}'">${post.title}</h3>

                        <div class="flex flex-wrap gap-1.5 mb-4">
                            ${post.tags ? post.tags.map(t => `<span class="px-2 py-0.5 bg-slate-800 text-[9px] text-slate-400 rounded-md border border-slate-700">#${t.name}</span>`).join('') : ''}
                        </div>

                        ${post.status === 'REJECTED' ? `
                            <div class="mb-4 p-3 bg-red-500/5 border border-red-500/20 rounded-xl rejection-shake">
                                <div class="flex items-center gap-2 text-red-400 mb-1">
                                    <span class="material-icons text-[14px]">report_problem</span>
                                    <span class="text-[9px] font-black uppercase tracking-wider">Lý do từ chối:</span>
                                </div>
                                <p class="text-[11px] text-slate-400 italic leading-relaxed">"${post.rejectionReason || 'Nội dung cần được điều chỉnh thêm'}"</p>
                            </div>
                        ` : `
                            <p class="text-xs text-slate-500 line-clamp-2 mb-4 leading-relaxed">${post.summary || 'Chưa có mô tả tóm tắt cho bài viết này.'}</p>
                        `}

                        <div class="flex items-center justify-between pt-4 border-t border-slate-800 mt-auto">
                            <div class="flex flex-col">
                                <span class="text-[10px] text-slate-600 uppercase font-bold tracking-tighter">Ngày khởi tạo</span>
                                <span class="text-[11px] text-slate-400">${new Date(post.createdAt).toLocaleDateString('vi-VN')}</span>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="location.href='/author/posts/editor?id=${post.id}'"
                                        class="w-10 h-10 flex items-center justify-center bg-slate-800 text-slate-400 hover:text-primary hover:bg-slate-700 rounded-xl transition-all" title="Chỉnh sửa">
                                    <span class="material-icons text-xl">edit</span>
                                </button>
                                <button onclick="deletePost(${post.id})"
                                        class="w-10 h-10 flex items-center justify-center bg-slate-800 text-slate-400 hover:text-red-500 hover:bg-red-500/10 rounded-xl transition-all" title="Xóa vĩnh viễn">
                                    <span class="material-icons text-xl">delete_outline</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        } catch (e) { console.error(e); }
    }

    function getStatusBadge(status) {
        const map = {
            'PUBLISHED': 'bg-green-500/10 text-green-400 border-green-500/20',
            'PENDING': 'bg-yellow-500/10 text-yellow-400 border-yellow-500/20',
            'REJECTED': 'bg-red-500/10 text-red-400 border-red-500/20',
            'DRAFT': 'bg-blue-500/10 text-blue-400 border-blue-500/20',
            'HIDDEN': 'bg-slate-500/10 text-slate-400 border-slate-500/20'
        };
        const icons = { 'PUBLISHED': 'check_circle', 'PENDING': 'schedule', 'REJECTED': 'cancel', 'DRAFT': 'drafts', 'HIDDEN': 'visibility_off' };

        return `
            <span class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-[10px] font-black border backdrop-blur-md ${map[status]}">
                <span class="material-icons text-xs">${icons[status]}</span>
                ${status}
            </span>`;
    }

    async function deletePost(id) {
        if(confirm("Xác nhận xóa vĩnh viễn bài viết này? Dữ liệu không thể khôi phục.")) {
            try {
                const res = await fetch(`${API_BASE}/posts/${id}`, { method: 'DELETE' });
                if(res.ok) {
                    // Hiệu ứng Toast đơn giản hoặc refresh list
                    fetchMyPosts();
                } else {
                    const err = await res.json();
                    alert("Lỗi: " + err.message);
                }
            } catch (e) { alert("Không thể kết nối đến máy chủ!"); }
        }
    }

    document.addEventListener('DOMContentLoaded', fetchMyPosts);
</script>
</body>
</html>
