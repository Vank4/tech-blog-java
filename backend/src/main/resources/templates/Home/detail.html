<!DOCTYPE html>
<html class="dark" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>TechNexus | Chi tiết bài viết</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-primary-fixed": "#00443a",
                        "on-tertiary-fixed-variant": "#004359",
                        "on-tertiary-fixed": "#00212e",
                        "surface-container-lowest": "#000000",
                        "surface-container-low": "#001715",
                        "inverse-on-surface": "#215e5a",
                        "outline": "#457f7b",
                        "on-primary": "#006658",
                        "on-surface-variant": "#7cb6b1",
                        "surface-tint": "#b6ffee",
                        "error": "#ff716c",
                        "secondary-fixed": "#36f8ee",
                        "background": "#001110",
                        "on-secondary": "#005a56",
                        "inverse-surface": "#e3fffc",
                        "on-error": "#490006",
                        "on-primary-fixed-variant": "#006456",
                        "primary-dim": "#00e8cb",
                        "tertiary-fixed-dim": "#00b6ed",
                        "error-container": "#9f0519",
                        "surface": "#001110",
                        "primary": "#b6ffee",
                        "tertiary-container": "#12c4fe",
                        "tertiary": "#67cfff",
                        "surface-variant": "#002b29",
                        "surface-container": "#001e1c",
                        "inverse-primary": "#006b5d",
                        "primary-fixed-dim": "#00e8cb",
                        "on-secondary-fixed-variant": "#006560",
                        "surface-dim": "#001110",
                        "primary-fixed": "#00f8d9",
                        "tertiary-dim": "#00b6ed",
                        "secondary": "#36f8ee",
                        "on-background": "#bdf9f4",
                        "on-surface": "#bdf9f4",
                        "on-secondary-fixed": "#004642",
                        "on-primary-container": "#005d50",
                        "surface-container-high": "#002422",
                        "error-dim": "#d7383b",
                        "secondary-container": "#006a65",
                        "primary-container": "#00fede",
                        "on-secondary-container": "#dbfffb",
                        "secondary-fixed-dim": "#0ceae0",
                        "surface-container-highest": "#002b29",
                        "on-tertiary-container": "#00394d",
                        "surface-bright": "#003230",
                        "outline-variant": "#0f504d",
                        "on-error-container": "#ffa8a3",
                        "secondary-dim": "#0ceae0",
                        "tertiary-fixed": "#12c4fe",
                        "on-tertiary": "#00445b"
                    },
                    fontFamily: {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .glass-panel { backdrop-filter: blur(24px); }
        .neo-border-left { border-left: 4px solid #00fede; }

        /* Chỉnh lại style cho ảnh trong bài viết để nó không bị tràn */
        #post-content img { border-radius: 0.75rem; max-width: 100%; height: auto; margin: 2rem auto; }
    </style>
    <!-- Core layout CSS for shared fragments -->
    <link rel="stylesheet" th:href="@{/css/base.css}"/>
    <link rel="stylesheet" th:href="@{/css/components.css}"/>
    <link rel="stylesheet" th:href="@{/css/layout.css}"/>
</head>
<body class="bg-surface text-on-surface font-body selection:bg-primary-container selection:text-on-primary-container">

<header th:replace="~{fragments/header :: header}"></header>

<main class="pt-20">
    <section class="relative w-full h-[600px] flex items-end overflow-hidden">
        <img id="post-thumbnail" alt="Post cover" class="absolute inset-0 w-full h-full object-cover" src=""/>
        <div class="absolute inset-0 bg-gradient-to-t from-surface via-surface/80 to-transparent"></div>
        <div class="relative max-w-[1440px] mx-auto px-8 pb-16 w-full">
            <div class="max-w-4xl">
                <span id="post-category" class="inline-block py-1 px-3 mb-6 bg-primary-container text-on-primary-fixed text-xs font-bold rounded uppercase tracking-widest">
                    Đang tải...
                </span>
                <h1 id="post-title" class="text-5xl md:text-6xl font-black tracking-tighter leading-tight mb-8">
                    Đang tải tiêu đề bài viết...
                </h1>
                <div class="flex items-center gap-6 text-on-surface-variant font-medium">
                    <div class="flex items-center gap-2">
                        <div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center border-2 border-primary/30 text-white font-bold">
                            <span id="post-author-avatar">A</span>
                        </div>
                        <span id="post-author">Đang tải...</span>
                    </div>
                    <div class="w-1.5 h-1.5 rounded-full bg-outline-variant"></div>
                    <span id="post-date">--/--/----</span>
                    <div class="w-1.5 h-1.5 rounded-full bg-outline-variant"></div>
                    <span id="post-views" class="flex items-center gap-1 text-primary">
                        <span class="material-symbols-outlined text-sm" data-icon="visibility">visibility</span>
                        0 views
                    </span>
                </div>
            </div>
        </div>
    </section>

    <div class="max-w-[1440px] mx-auto px-8 flex flex-col lg:flex-row gap-16 mt-12 mb-20">

        <aside class="hidden xl:block sticky top-32 h-fit">
            <div class="flex flex-col gap-4 bg-surface-container p-3 rounded-2xl border border-outline-variant/15 glass-panel">
                <button onclick="toggleInteraction('like')" id="btn-like" class="flex flex-col gap-1 items-center p-3 hover:bg-surface-variant rounded-xl transition-all group">
                    <span id="icon-like" class="material-symbols-outlined text-[#adaaaa] group-hover:text-primary group-hover:scale-110 transition-all" data-icon="thumb_up">thumb_up</span>
                    <span id="count-like" class="text-[10px] font-bold text-on-surface-variant">0</span>
                </button>
                
                <div class="h-px bg-outline-variant/20 mx-2"></div>
                
                <button onclick="toggleInteraction('favorite')" id="btn-save" class="flex flex-col gap-1 items-center p-3 hover:bg-surface-variant rounded-xl transition-all group">
                    <span id="icon-save" class="material-symbols-outlined text-[#adaaaa] group-hover:text-primary group-hover:scale-110 transition-all" data-icon="bookmark">bookmark</span>
                    <span id="count-save" class="text-[10px] font-bold text-on-surface-variant">0</span>
                </button>
                
                <div class="h-px bg-outline-variant/20 mx-2"></div>
                
                <button class="flex flex-col items-center p-3 hover:bg-surface-variant rounded-xl transition-all group">
                    <span class="material-symbols-outlined text-[#adaaaa] group-hover:text-primary transition-colors" data-icon="share">share</span>
                </button>
            </div>
        </aside>

        <article class="flex-1 max-w-3xl">
            <div id="post-content" class="prose prose-invert prose-emerald max-w-none text-on-surface-variant leading-8">
                <div class="animate-pulse space-y-4 py-10">
                    <div class="h-4 bg-surface-variant rounded w-3/4"></div>
                    <div class="h-4 bg-surface-variant rounded w-full"></div>
                    <div class="h-4 bg-surface-variant rounded w-5/6"></div>
                </div>
            </div>

            <section class="mt-24 pt-12 border-t border-outline-variant/15">
                <div class="flex items-center justify-between mb-10">
                    <h3 class="text-2xl font-bold text-white tracking-tight">Intelligence Exchange</h3>
                    <div class="px-3 py-1 bg-primary/10 rounded-lg border border-primary/20">
                         <span class="text-[10px] font-black text-primary uppercase tracking-widest" id="comment-count">0 COMMENTS</span>
                    </div>
                </div>

                <!-- Comment Input -->
                <div class="mb-12 p-8 bg-surface-container rounded-3xl border border-outline-variant/10 glass-panel shadow-2xl relative overflow-hidden group">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-primary/5 rounded-bl-full -mr-16 -mt-16 transition-transform group-hover:scale-110"></div>
                    <div class="flex items-center gap-4 mb-6 relative">
                        <div class="w-10 h-10 rounded-xl bg-primary-container flex items-center justify-center shadow-lg">
                            <span class="material-symbols-outlined text-on-primary-fixed" data-icon="terminal">terminal</span>
                        </div>
                        <span class="text-sm font-bold text-white tracking-wide">Initialize new node in the exchange...</span>
                    </div>
                    <textarea id="main-comment-input" class="w-full bg-surface-container-lowest border-0 border-b-2 border-outline/30 focus:border-primary focus:ring-0 text-on-surface p-4 rounded-t-xl transition-all placeholder:text-on-surface-variant/40 text-sm leading-relaxed" placeholder="Share your insights with the monolith..." rows="3"></textarea>
                    <div class="flex justify-end mt-6">
                        <button onclick="submitComment()" class="bg-gradient-to-br from-primary to-primary-dim px-8 py-3 rounded-xl text-on-primary-fixed font-black text-[10px] uppercase tracking-[0.2em] hover:brightness-110 active:scale-95 transition-all shadow-lg">
                            Post Insight
                        </button>
                    </div>
                </div>

                <!-- Comment List -->
                <div id="comment-list" class="space-y-8">
                    <div class="animate-pulse flex flex-col gap-4">
                        <div class="h-4 bg-surface-container-high rounded w-1/4"></div>
                        <div class="h-10 bg-surface-container-high rounded w-full"></div>
                    </div>
                </div>
            </section>
        </article>

        <aside class="w-full lg:w-80 space-y-8">
            <div class="sticky top-32 h-fit w-full lg:w-80 flex flex-col border border-[#484847]/15 rounded-2xl bg-[#0e0e0e] dark:bg-[#0e0e0e] overflow-hidden">
                <div class="p-6 border-b border-[#484847]/15">
                    <div class="text-lg font-bold text-[#14ffdf]">Intelligence Terminal</div>
                    <div class="text-sm tracking-wide uppercase text-on-surface-variant mt-1">Post Metadata</div>
                </div>

                <div class="flex flex-col flex-1">
                    <div class="text-[#14ffdf] font-bold bg-[#1a1a1a] border-l-4 border-[#14ffdf] py-4 px-6 flex items-center gap-4">
                        <span class="material-symbols-outlined" data-icon="label">label</span>
                        <span class="font-['Inter'] text-sm tracking-wide uppercase">Related Tags</span>
                    </div>

                    <div id="post-tags" class="px-6 py-6 space-y-3">
                        <span class="text-xs text-on-surface-variant">Đang tải...</span>
                    </div>

                    <div class="p-6 mt-4 border-t border-[#484847]/15">
                        <button onclick="window.scrollTo({ top: 0, behavior: 'smooth' })" class="w-full bg-[#1a1a1a] border border-[#484847]/50 text-[#14ffdf] font-bold py-3 rounded-lg text-xs uppercase tracking-widest hover:bg-primary/10 transition-all active:scale-95">
                            Back to Top
                        </button>
                    </div>
                </div>
            </div>
        </aside>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script>
    const API_BASE = "http://localhost:8081/api/v1";
    const DEFAULT_AVATAR = "https://lh3.googleusercontent.com/aida-public/AB6AXuAMTVKLE7jCewBWF3Z-8L-_NFspNpEw9leOoqs1TgrZQXHJa0Todogbgl0RVoMxBU8SOgJ_TKNYi-rpDQ9elZVd-eC_4RoGyiorju5-9BraVaV26MX5j8Cur-O9TafgG60xcP5YfNsXJ8YNrF9pMBmnPdh_8hnhNZk7h25685I6NARuWDKWo7QNItPstsxcgop4sOFxOSxbjp1y7zFO0Y2i56JEQfCt_iT8qIUH1jRzQQ3zBCjLAw9bFQ9JodV64yq63hnGMKsCSqc";

    const getToken = () => localStorage.getItem("techblog.accessToken");

    const resolveAvatarUrl = (avatarUrl) => {
        if (!avatarUrl) return DEFAULT_AVATAR;
        if (avatarUrl.startsWith("http://") || avatarUrl.startsWith("https://")) return avatarUrl;
        if (avatarUrl.startsWith("/")) return avatarUrl;
        return `/${avatarUrl}`;
    };

    const toggleElement = (selector, shouldShow, displayValue = "inline-flex") => {
        const element = document.querySelector(selector);
        if (!element) return;
        element.style.display = shouldShow ? displayValue : "none";
    };

    const applyAuthState = (profile) => {
        const roles = profile?.roles || [];
        const isAuthenticated = !!profile;
        const guestPanel = document.querySelector("[data-guest-panel]");
        const authPanel = document.querySelector("[data-auth-panel]");
        const avatar = document.querySelector("[data-user-avatar]");
        const avatarLink = document.querySelector("[data-avatar-link]");

        if (guestPanel) {
            guestPanel.style.display = isAuthenticated ? "none" : "flex";
        }

        if (authPanel) {
            authPanel.style.display = isAuthenticated ? "flex" : "none";
        }

        toggleElement("[data-nav-profile]", isAuthenticated);
        toggleElement("[data-nav-author]", roles.includes("AUTHOR") || roles.includes("ADMIN"));
        toggleElement("[data-nav-admin]", roles.includes("ADMIN"));

        if (avatar) {
            avatar.src = resolveAvatarUrl(profile?.avatarUrl);
            avatar.alt = profile?.fullName ? `Ảnh đại diện của ${profile.fullName}` : "Ảnh đại diện người dùng";
        }

        if (avatarLink) {
            avatarLink.href = isAuthenticated ? "/profile" : "/login";
        }
    };

    async function loadCurrentUserState() {
        const token = getToken();
        if (!token) {
            applyAuthState(null);
            return;
        }

        try {
            const response = await fetch("/api/v1/users/me", {
                headers: {
                    Authorization: `Bearer ${token}`
                }
            });

            const result = await response.json().catch(() => ({}));
            if (!response.ok || result.success === false) {
                localStorage.removeItem("techblog.accessToken");
                applyAuthState(null);
                return;
            }

            applyAuthState(result.data || null);
        } catch (error) {
            applyAuthState(null);
        }
    }

    const formatDate = (dateString) => {
        if (!dateString) return "Vừa xong";
        const date = new Date(dateString);
        return date.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
    };

    let currentPostId = null;

    async function loadPostDetail() {
        const pathArray = window.location.pathname.split('/');
        const slug = pathArray[pathArray.length - 1];

        if (!slug || slug === 'detail.html' || slug === '') return;

        try {
            const response = await fetch(`${API_BASE}/posts/${slug}`);
            if (!response.ok) throw new Error("Không tìm thấy bài viết");

            const result = await response.json();
            const post = result.data;
            currentPostId = post.id;

            if (post) {
                document.getElementById('post-thumbnail').src = post.thumbnailUrl || 'https://images.unsplash.com/photo-1635070041078-e363dbe005cb';
                document.getElementById('post-category').textContent = post.categoryName || 'Tech';
                document.getElementById('post-title').textContent = post.title;
                document.getElementById('post-author').textContent = post.authorName || 'Admin';
                document.getElementById('post-author-avatar').textContent = post.authorName ? post.authorName.charAt(0).toUpperCase() : 'A';
                document.getElementById('post-date').textContent = formatDate(post.createdAt);
                document.getElementById('post-views').innerHTML = `<span class="material-symbols-outlined text-sm" data-icon="visibility">visibility</span> ${post.viewCount || 0} views`;
                document.getElementById('post-content').innerHTML = post.content || `<p class="text-xl">${post.summary}</p>`;

                const tagsContainer = document.getElementById('post-tags');
                if (tagsContainer) {
                    tagsContainer.innerHTML = (post.tags && post.tags.length > 0) ? post.tags.map(tag => `
                        <div class="p-3 bg-surface-container-high rounded-xl border-l-2 border-primary hover:bg-surface-variant transition-colors cursor-pointer" onclick="window.location.href='/?tagId=${tag.id}'">
                            <p class="text-xs font-bold tracking-wide text-on-surface">#${tag.name}</p>
                        </div>
                    `).join('') : `<span class="text-xs text-on-surface-variant">Không có tag nào.</span>`;
                }

                loadInteractionStatus();
                loadComments();
            }
        } catch (error) {
            console.error("Lỗi:", error);
            document.getElementById('post-title').textContent = "Bài viết không tồn tại.";
        }
    }

    // COMMENT LOGIC
    async function loadComments() {
        if (!currentPostId) return;
        try {
            const res = await fetch(`${API_BASE}/comments/POST/${currentPostId}`);
            const result = await res.json();
            const comments = result.data || [];
            renderComments(comments);
            document.getElementById('comment-count').textContent = `${comments.length} COMMENTS`;
        } catch (e) {
            console.error(e);
        }
    }

    function renderComments(comments, containerId = 'comment-list', isReply = false) {
        const container = document.getElementById(containerId);
        if (!isReply) container.innerHTML = '';

        if (comments.length === 0 && !isReply) {
            container.innerHTML = '<p class="text-sm text-on-surface-variant/50 italic py-10 text-center">No nodes in the exchange yet. Be the first.</p>';
            return;
        }

        comments.forEach(c => {
            const commentEl = document.createElement('div');
            commentEl.className = `${isReply ? 'ml-12 mt-6 border-l-2 border-outline-variant/10 pl-6' : 'mb-10 last:mb-0'}`;
            commentEl.innerHTML = `
                <div class="group/node relative">
                    <div class="flex items-center gap-4 mb-3">
                        <div class="w-10 h-10 rounded-xl bg-surface-container-high border border-primary/20 flex items-center justify-center text-primary font-black shadow-lg">
                            ${c.authorName ? c.authorName.charAt(0).toUpperCase() : '?'}
                        </div>
                        <div>
                            <p class="text-sm font-bold text-white tracking-tight">${c.authorName}</p>
                            <p class="text-[10px] text-on-surface-variant uppercase tracking-widest font-medium">${formatDate(c.createdAt)}</p>
                        </div>
                    </div>
                    <div class="bg-surface-container/50 p-6 rounded-2xl border border-outline-variant/10 leading-relaxed text-on-surface-variant text-sm">
                        ${c.content}
                    </div>
                    <div class="flex items-center gap-4 mt-3 opacity-0 group-hover/node:opacity-100 transition-opacity">
                        <button onclick="showReplyForm(${c.id})" class="text-[10px] font-black text-primary uppercase tracking-widest hover:underline flex items-center gap-1">
                            <span class="material-symbols-outlined text-xs" data-icon="reply">reply</span> Reply
                        </button>
                        <button onclick="showReportForm(${c.id})" class="text-[10px] font-black text-on-surface-variant/40 hover:text-red-400 uppercase tracking-widest flex items-center gap-1">
                             Report
                        </button>
                    </div>
                    <div id="reply-form-container-${c.id}" class="mt-4 hidden"></div>
                    <div id="replies-container-${c.id}"></div>
                </div>
            `;
            container.appendChild(commentEl);
            if (c.replies && c.replies.length > 0) {
                renderComments(c.replies, `replies-container-${c.id}`, true);
            }
        });
    }

    async function submitComment(parentId = null) {
        const token = getToken();
        if (!token) {
            alert("Vui lòng đăng nhập để bình luận!");
            window.location.href = "/login";
            return;
        }

        const inputId = parentId ? `reply-input-${parentId}` : 'main-comment-input';
        const input = document.getElementById(inputId);
        const content = input.value.trim();

        if (!content) return;

        try {
            const response = await fetch(`${API_BASE}/comments`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                    content,
                    targetType: 'POST',
                    targetId: currentPostId,
                    parentId
                })
            });

            if (response.ok) {
                input.value = '';
                if (parentId) document.getElementById(`reply-form-container-${parentId}`).classList.add('hidden');
                loadComments();
            } else {
                const err = await response.json();
                alert("Lỗi: " + err.message);
            }
        } catch (e) {
            console.error(e);
        }
    }

    function showReplyForm(commentId) {
        const container = document.getElementById(`reply-form-container-${commentId}`);
        container.innerHTML = `
            <div class="p-6 bg-surface-container-high rounded-2xl border border-primary/20 shadow-xl">
                <textarea id="reply-input-${commentId}" class="w-full bg-surface-container-lowest border-0 border-b-2 border-primary/30 focus:border-primary focus:ring-0 text-on-surface p-3 text-sm rounded-t-lg" placeholder="Type your reply..." rows="2"></textarea>
                <div class="flex justify-end gap-3 mt-4">
                    <button onclick="this.closest('.hidden').classList.add('hidden')" class="px-4 py-2 text-[10px] font-black text-on-surface-variant uppercase tracking-widest">Cancel</button>
                    <button onclick="submitComment(${commentId})" class="bg-primary px-6 py-2 rounded-xl text-on-primary-fixed font-black text-[10px] uppercase tracking-widest">Reply</button>
                </div>
            </div>
        `;
        container.classList.remove('hidden');
    }

    function showReportForm(commentId) {
        const reason = prompt("Lý do báo cáo vi phạm:");
        if (reason) {
            reportComment(commentId, reason);
        }
    }

    async function reportComment(commentId, reason) {
        const token = getToken();
        if (!token) { alert("Vui lòng đăng nhập!"); return; }

        try {
            const response = await fetch(`${API_BASE}/comments/${commentId}/report`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ reason })
            });

            if (response.ok) {
                alert("Đã gửi báo cáo vi phạm thành công. Admin sẽ sớm xử lý.");
            }
        } catch (e) { console.error(e); }
    }

    // INTERACTION LOGIC (Like & Save)
    async function loadInteractionStatus() {
        if (!currentPostId) return;
        const token = getToken();
        
        try {
            const headers = {};
            if (token) headers['Authorization'] = `Bearer ${token}`;

            const res = await fetch(`${API_BASE}/interactions/status?targetType=POST&targetId=${currentPostId}`, { headers });
            const result = await res.json();
            
            if (result.success) {
                updateInteractionUI(result.data);
            }
        } catch (e) { console.error("Failed to load interaction status", e); }
    }

    function updateInteractionUI(data) {
        document.getElementById('count-like').textContent = data.likeCount || 0;
        document.getElementById('count-save').textContent = data.saveCount || 0;

        const iconLike = document.getElementById('icon-like');
        if (data.liked) {
            iconLike.classList.remove('text-[#adaaaa]');
            iconLike.classList.add('text-primary');
            iconLike.style.fontVariationSettings = "'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24";
        } else {
            iconLike.classList.add('text-[#adaaaa]');
            iconLike.classList.remove('text-primary');
            iconLike.style.fontVariationSettings = "'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24";
        }

        const iconSave = document.getElementById('icon-save');
        if (data.saved) {
            iconSave.classList.remove('text-[#adaaaa]');
            iconSave.classList.add('text-primary');
            iconSave.style.fontVariationSettings = "'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24";
        } else {
            iconSave.classList.add('text-[#adaaaa]');
            iconSave.classList.remove('text-primary');
            iconSave.style.fontVariationSettings = "'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24";
        }
    }

    async function toggleInteraction(action) {
        const token = getToken();
        if (!token) {
            alert("Vui lòng đăng nhập để thực hiện thao tác này!");
            window.location.href = "/login";
            return;
        }

        const endpoint = action === 'like' ? 'like' : 'favorite';
        
        try {
            const response = await fetch(`${API_BASE}/interactions/${endpoint}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ targetType: 'POST', targetId: currentPostId })
            });

            if (response.ok) {
                const result = await response.json();
                if (result.success) {
                    updateInteractionUI(result.data);
                }
            } else if (response.status === 401) {
                alert("Phiên đăng nhập hết hạn. Vui lòng đăng nhập lại.");
                window.location.href = "/login";
            }
        } catch (e) { console.error("Interaction failed", e); }
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadCurrentUserState();
        loadPostDetail();
    });
</script>
</body>
</html>
